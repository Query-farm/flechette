# Publish @query-farm/flechette to npm.
#
# Trigger: pushing a `vX.Y.Z` tag. `workflow_dispatch` is kept for manual
# re-runs of a tag that already exists.
#
# Auth is npm Trusted Publishing (OIDC) — NO long-lived token, matching the
# other Query Farm npm packages (@query-farm/vgi, @query-farm/vgi-rpc). Each
# run mints a short-lived, workflow-scoped credential via GitHub's OIDC
# (`id-token: write` below), and npm attaches provenance automatically.
#
# Prerequisites (one-time, on npmjs.com — not per release):
#   • Configure a trusted publisher for the package:
#       https://www.npmjs.com/package/@query-farm/flechette/access
#       → "Trusted Publisher" → GitHub Actions, with:
#         Organization / user : Query-farm
#         Repository          : flechette
#         Workflow filename   : publish.yml
#         Environment         : (leave blank — none configured here)
#   • The package must already exist on npm (it does — 2.4.0 was published
#     manually). OIDC cannot publish a package's very first version.
#   • No `NPM_TOKEN` secret is needed and none should be set.

name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack + validate but do not publish"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # npm provenance (OIDC)

jobs:
  publish:
    name: Build, verify, publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing (OIDC) requires npm CLI >= 11.5.1; the bundled npm
      # may be older, so upgrade before publishing.
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Cheap safety: a v-tag must match the version in package.json, so we
      # never publish 2.4.0 under a v2.4.1 tag or vice-versa.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VERSION   tag: $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # `prepublishOnly` runs test + lint + build, but run them here too so a
      # failure is attributed to the right step in the run log.
      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build (bundles + types)
        run: npm run build

      # The fork tracks dist/ so `github:Query-farm/flechette#<branch>`
      # installs work without a build step. A stale dist means the tag and the
      # tarball disagree — fail instead of shipping the mismatch.
      - name: Verify tracked dist/ matches a fresh build
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date — run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi

      # Refuse to re-publish a version that already exists — makes accidental
      # re-runs a clean no-op instead of a hard error.
      - name: Skip if version already on npm
        id: exists
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "@query-farm/flechette@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@query-farm/flechette@$PKG_VERSION already published — nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (dry-run)
        if: >-
          steps.exists.outputs.already == 'false' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.dry-run
        run: npm publish --provenance --access public --dry-run

      - name: Publish
        if: >-
          steps.exists.outputs.already == 'false' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry-run)
        run: npm publish --provenance --access public
