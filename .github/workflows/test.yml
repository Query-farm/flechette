name: Test

on:
  push:
    branches:
      - main
      # The fork's own work (and every published @query-farm/flechette
      # version) lives on this branch; `main` mirrors upstream. Run the
      # suite on pushes here too, otherwise the fork's code is never tested.
      - fix/timestamp-bigint-encode
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [24, 25]

    name: Node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test
